<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batsy Chat</title><link rel="stylesheet" href="/chat.css"></head>
<body><aside id="sidebar"><button id="new">＋ New chat</button><input id="search" placeholder="Search chats" aria-label="Search chats"><nav id="conversations"></nav><div class="sidefoot">Batsy · local chat</div></aside>
<main><header><strong>Batsy</strong><span id="status">Ready</span><span id="usage"></span><label><input id="listen" type="checkbox"> Listen</label><label><input id="speak" type="checkbox"> Read aloud</label><select id="brain" title="Brain"><option value="auto">Auto</option><option value="local">Local</option><option value="codex">Codex</option></select><button id="export">Export</button><button id="mode">Switch to chat</button></header>
<section id="messages" aria-live="polite"></section><form id="composer"><button id="mic" type="button" title="Push to talk">🎙</button><textarea id="input" rows="1" placeholder="Message Batsy… (Enter to send, Shift+Enter for newline)"></textarea><button id="send">Send</button><button id="stop" type="button" hidden>Stop</button></form></main>
<dialog id="approval"><p id="question"></p><button id="deny">Deny</button><button id="allow">Allow</button></dialog><script src="/chat.js" defer></script></body></html>
